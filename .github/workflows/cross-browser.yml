name: Cross-browser

# The full matrix across Chromium, Firefox and WebKit. Split out of CI because
# it takes roughly ten minutes on a 2-core runner, and a per-push check that
# slow is one people learn to ignore.
#
# The engine differences it covers are real — Firefox has no AAC encoder so
# mov→mp4 falls through to ffmpeg there, Chromium refuses SVG blobs to
# createImageBitmap, only Safari decodes HEIC natively — but they change with
# browser releases, not with our commits. Nightly is the right cadence, and it
# catches a browser update breaking us before a user does.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    # Also on any change to the engines themselves, where a cross-browser
    # regression is actually plausible.
    branches: [main]
    paths:
      # Everything that can change what a browser actually renders or runs.
      # This was src/engine only, so a design pass touching components and
      # styles reached production with no cross-browser check at all — on a
      # project where WebKit produced most of the interesting breakage.
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.mjs"
      - "vitest.browser.config.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One browser per runner. Running all three on a single 2-core box ran
      # ffmpeg's wasm heap out of memory — which surfaced as eight consecutive
      # codec failures and cost a real debugging session before it turned out
      # to be contention. Separate runners cost nothing extra in wall-clock,
      # since they run concurrently.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Test (${{ matrix.browser }})
        run: pnpm test:browser
        env:
          ONHAND_BROWSER: ${{ matrix.browser }}

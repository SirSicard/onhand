name: Deploy

# The Cloudflare Pages project is Direct Upload — `wrangler pages project list`
# reports "Git Provider: No" — so pushing to GitHub deploys NOTHING. That is not
# obvious from anywhere: the site stays up serving an old build, CI goes green,
# and the only symptom is that a change never appears. It sat three commits
# behind for an hour before anyone looked.
#
# This workflow closes that gap. It needs two repository secrets:
#
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — e677ec872dea666fd3cd743630c6a88f
#
# Until those exist the job fails fast with a clear message rather than
# pretending to deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys race; the later push should win.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check credentials are configured
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets."
            echo "::error::Until then, deploy by hand: pnpm build && npx wrangler pages deploy dist --project-name onhand --branch main"
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      # prebuild copies and gzips the ffmpeg core. Running `astro build` here
      # instead of `pnpm build` would skip that and ship a site whose every
      # audio conversion 404s.
      - name: Build
        run: pnpm build

      # Cloudflare Pages rejects any single file over 25 MiB and fails the
      # WHOLE upload. Catching it here names the file; catching it in wrangler
      # output means reading a deploy log to find out.
      - name: Assert nothing exceeds the 25 MiB per-file limit
        run: |
          big=$(find dist -type f -size +25M)
          if [ -n "$big" ]; then
            echo "::error::files over Cloudflare Pages' 25 MiB limit:"; echo "$big"
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name onhand --branch main

      # A deploy that reports success while the alias still serves the old build
      # is the failure this whole file exists to prevent, so check the live URL
      # rather than trusting the exit code.
      - name: Verify the live site serves the engine
        run: |
          for i in 1 2 3 4 5 6; do
            ct=$(curl -s -o /dev/null -w "%{content_type}" https://onhand.pages.dev/ffmpeg/ffmpeg-core.wasm.gz)
            case "$ct" in
              application/gzip*) echo "live engine OK ($ct)"; exit 0 ;;
              *) echo "attempt $i: got '$ct', waiting for the alias to update"; sleep 20 ;;
            esac
          done
          echo "::error::onhand.pages.dev is not serving the engine — it returns '$ct', probably the 404 page with a 200"
          exit 1

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — CI should never queue behind itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Formatting was drifting unchecked: 24 files were unformatted before
      # this step existed, because `pnpm lint` was a script nobody ran.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (node)
        run: pnpm test

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # The conversion matrix needs real wasm codecs, so it needs a real
      # browser. Chromium only on every push: all three takes ~10 minutes on a
      # 2-core runner, and CI that slow stops getting read. The cross-browser
      # run is a separate scheduled job — see cross-browser.yml — because the
      # differences between engines are real but they do not change per commit.
      - name: Test (chromium)
        run: pnpm test:browser

      - name: Build
        run: pnpm build

      # The whole product rests on cross-origin isolation being live. If _headers
      # ever stops shipping, SharedArrayBuffer dies silently and the multithread
      # path just never engages — no error, just mysteriously slower. Assert it.
      - name: Assert COOP/COEP headers ship
        run: |
          test -f dist/_headers || { echo "::error::dist/_headers is missing"; exit 1; }
          grep -q "Cross-Origin-Opener-Policy: same-origin" dist/_headers \
            || { echo "::error::COOP header missing from dist/_headers"; exit 1; }
          grep -q "Cross-Origin-Embedder-Policy: require-corp" dist/_headers \
            || { echo "::error::COEP header missing from dist/_headers"; exit 1; }
          echo "cross-origin isolation headers present"

      # The ffmpeg core is NOT committed — prebuild copies it out of
      # node_modules and gzips it. Two things go wrong silently here:
      #   1. A build command that bypasses the prebuild hook deploys a site
      #      that looks healthy and 404s on every audio job.
      #   2. Cloudflare Pages rejects ANY file over 25 MiB. The raw core is
      #      30.7 MiB, so an uncompressed copy fails the whole upload — which
      #      is a line in a deploy log, not a test failure.
      # postbuild generates the service worker. A build command that skips the
      # hooks (astro build instead of pnpm build) produces a site with no
      # offline support and no error to show for it.
      - name: Assert the service worker shipped
        run: |
          test -f dist/sw.js \
            || { echo "::error::dist/sw.js missing — did postbuild run?"; exit 1; }
          grep -q "onhand-shell-" dist/sw.js \
            || { echo "::error::dist/sw.js is not the generated worker"; exit 1; }
          # It must never precache a codec: that would download ~10 MB on first
          # visit from someone who only wanted to convert a PNG.
          node -e "
            const sw = require('fs').readFileSync('dist/sw.js','utf8');
            const list = JSON.parse(sw.match(/const PRECACHE = (\[[\s\S]*?\]);/)[1]);
            const heavy = list.filter(u => /\.(wasm|gz)\$/.test(u));
            if (heavy.length) { console.error('::error::service worker precaches codecs: ' + heavy); process.exit(1); }
            console.log('service worker precaches ' + list.length + ' shell files, no codecs');
          "

      - name: Assert the ffmpeg core shipped and can be deployed
        run: |
          test -f dist/ffmpeg/ffmpeg-core.js \
            || { echo "::error::dist/ffmpeg/ffmpeg-core.js missing — did prebuild run?"; exit 1; }
          test -f dist/ffmpeg/ffmpeg-core.wasm.gz \
            || { echo "::error::dist/ffmpeg/ffmpeg-core.wasm.gz missing — did prebuild run?"; exit 1; }
          # The ESM build is the only one that works: @ffmpeg/ffmpeg always
          # creates a module worker, so it always loads the core with import().
          grep -q "export default" dist/ffmpeg/ffmpeg-core.js \
            || { echo "::error::ffmpeg-core.js is not the ESM build — import() will fail"; exit 1; }
          # Nothing in the deployed output may exceed Cloudflare's per-file cap.
          big=$(find dist -type f -size +25M)
          if [ -n "$big" ]; then
            echo "::error::files over Cloudflare Pages' 25 MiB limit:"; echo "$big"
            find dist -type f -size +25M -exec ls -la {} \;
            exit 1
          fi
          echo "ffmpeg core present ($(wc -c < dist/ffmpeg/ffmpeg-core.wasm.gz) bytes gz), nothing over 25 MiB"

      # Prime directive 1: file bytes never leave the device. The strongest cheap
      # guard is that the built output contains no outbound endpoints at all.
      - name: Assert no external network endpoints in build output
        run: |
          if grep -rEIl "https?://(?!onhand\.pages\.dev)" dist --include="*.js" -P 2>/dev/null \
             | grep -q .; then
            echo "::warning::external URL found in build output — verify it is not an upload path"
            grep -rEIho "https?://[a-zA-Z0-9._/-]*" dist --include="*.js" -P | sort -u | head -20
          else
            echo "no external endpoints in client bundle"
          fi
